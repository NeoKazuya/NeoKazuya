name: Update weekly activity
on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh activity
        env:
          GH_TOKEN: ${{ secrets.PROFILE_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Add PROFILE_READ_TOKEN with read access to your repositories. Keeping the existing card.'
            exit 1
          fi
          python scripts/activity.py
      - name: Publish cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-dark.svg assets/activity-light.svg activity.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh weekly build log'
            git push
          fi
